name: fibo_core
description: Shared backend services (Parse, AWS IoT, device API, scenes) and design tokens for the Fibo phone and tablet apps.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  parse_server_sdk_flutter: ^10.0.0
  http: ^1.2.0
  uuid: ^4.3.0
  mqtt_client: ^10.11.11
  crypto: ^3.0.7
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
